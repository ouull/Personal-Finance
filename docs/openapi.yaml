openapi: 3.0.0
info:
  title: Personal Finance API
  version: 1.0.0
  description: REST API for Personal Finance cross-platform architecture (Web, iOS, Android)
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                deviceInfo:
                  type: string
      responses:
        '200':
          description: Successful login
  /dashboard:
    get:
      summary: Get dashboard statistics
      responses:
        '200':
          description: Dashboard stats
  /accounts:
    get:
      summary: Get all accounts
      responses:
        '200':
          description: List of accounts
    post:
      summary: Create account
      responses:
        '201':
          description: Created account
  # See api-contract.md for full list of endpoints.
